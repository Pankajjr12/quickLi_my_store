<section class="bg-blue-50">
  <div class="container mx-auto p-4 flex flex-col lg:flex-row gap-5">
    <!-- Address -->
    <div class="w-full">
      <h3 class="text-lg font-semibold">Choose your address</h3>

      <div class="bg-white p-2 grid gap-4">
        <label *ngFor="let address of addressList; let i = index" [class.hidden]="!address.status">
          <div class="border rounded p-3 flex gap-3 hover:bg-blue-50">
            <input type="radio" name="address" [value]="i" (change)="selectedAddress = i" />

            <div>
              <p>{{ address.address_line }}</p>
              <p>{{ address.city }}</p>
              <p>{{ address.state }}</p>
              <p>{{ address.country }} - {{ address.pincode }}</p>
              <p>{{ address.mobile }}</p>
            </div>
          </div>
        </label>

        <div
          (click)="openAddress = true"
          class="h-16 bg-blue-50 border-2 border-dashed flex justify-center items-center cursor-pointer"
        >
          Add address
        </div>
      </div>
    </div>

    <!-- Summary -->
    <div class="w-full max-w-md bg-white py-4 px-2">
      <h3 class="text-lg font-semibold">Summary</h3>

      <div class="p-4">
        <h3 class="font-semibold">Bill details</h3>

        <div class="flex justify-between">
          <p>Items total</p>
          <p>
            <span class="line-through text-neutral-400">
              {{ displayPrice(notDiscountTotalPrice) }}
            </span>
            &nbsp;
            <span>{{ displayPrice(totalPrice) }}</span>
          </p>
        </div>

        <div class="flex justify-between">
          <p>Quantity total</p>
          <p>{{ totalQty }} item</p>
        </div>

        <div class="flex justify-between">
          <p>Delivery Charge</p>
          <p>Free</p>
        </div>

        <div class="font-semibold flex justify-between">
          <p>Grand total</p>
          <p>{{ displayPrice(totalPrice) }}</p>
        </div>
      </div>

      <div class="flex flex-col gap-4 px-4 pb-4">
        <button
          (click)="handleOnlinePayment()"
          class="py-2 px-4 bg-green-600 hover:bg-green-700 rounded text-white font-semibold"
        >
          Online Payment
        </button>

        <button
          (click)="handleCashOnDelivery()"
          class="py-2 px-4 border-2 border-green-600 text-green-600 hover:bg-green-600 hover:text-white rounded"
        >
          Cash on Delivery
        </button>
      </div>
    </div>
  </div>

  <app-add-address *ngIf="openAddress" (close)="openAddress = false"> </app-add-address>
</section>

<section class="container mx-auto w-full px-2">

    <div class="mx-auto my-4 w-full max-w-lg rounded bg-white p-7">
  
      <p class="text-lg font-semibold">
        Forgot Password
      </p>
  
      <form
        [formGroup]="forgotPasswordForm"
        (ngSubmit)="handleSubmit()"
        class="grid gap-4 py-4">
  
        <div class="grid gap-1">
  
          <label>Email</label>
  
          <input
            type="email"
            formControlName="email"
            class="rounded border bg-blue-50 p-2 outline-none focus:border-primary-200"
            placeholder="Enter your email">
  
          @if (f.email.touched && f.email.invalid) {
            <small class="text-red-500">
              Please enter a valid email.
            </small>
          }
  
        </div>
  
        <button
          type="submit"
          [disabled]="forgotPasswordForm.invalid || isLoading"
          class="my-3 rounded py-2 font-semibold tracking-wide text-white"
          [ngClass]="
            forgotPasswordForm.valid
              ? 'bg-green-800 hover:bg-green-700'
              : 'bg-gray-500'
          ">
  
          {{ isLoading ? 'Sending...' : 'Send OTP' }}
  
        </button>
  
      </form>
  
      <p>
        Already have an account?
  
        <a
          routerLink="/login"
          class="font-semibold text-green-700 hover:text-green-800">
  
          Login
  
        </a>
      </p>
  
    </div>
  
  </section>

<section class="bg-white">

  <div class="container mx-auto p-4">

    <p class="font-semibold mb-4">
      Search Results: {{ data.length }}
    </p>


    <!-- Product Grid -->
    <div
      infiniteScroll
      [infiniteScrollDistance]="2"
      [infiniteScrollThrottle]="200"
      (scrolled)="handleFetchMore()"
    >

      <div class="grid grid-cols-2 lg:grid-cols-5 gap-4">


        <!-- Products -->
        <div *ngFor="let product of data">

          <app-card-product
            [product]="product">
          </app-card-product>

        </div>



        <!-- Loading Cards -->
        <ng-container *ngIf="loading">

          <div *ngFor="let item of loadingArrayCard">

            <app-card-loading>
            </app-card-loading>

          </div>

        </ng-container>


      </div>


    </div>



    <!-- No Data -->
    <div
      *ngIf="!loading && data.length === 0"
      class="flex flex-col justify-center items-center w-full py-10"
    >

      <img
        src="images/nodata.png"
        class="w-100 h-80 object-contain"
        alt="No data"
      >

      <p class="font-semibold mt-3">
        No Data Found
      </p>

    </div>


  </div>

</section>

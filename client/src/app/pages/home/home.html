<section class="bg-white">
  <!-- Banner -->
  <div class="container mx-auto px-4 mt-4">
    <div class="relative overflow-hidden rounded-3xl shadow-lg">
      <div
        class="flex transition-transform duration-700 ease-in-out"
        [style.transform]="'translateX(-' + currentBanner * 100 + '%)'"
      >
        <img
          *ngFor="let banner of banners"
          [src]="banner"
          class="w-full flex-shrink-0 h-[180px] sm:h-[250px] md:h-[320px] lg:h-[420px] object-cover"
        />
      </div>

      <!-- Previous -->
      <button
        (click)="previousBanner()"
        class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white rounded-full w-10 h-10 flex items-center justify-center shadow"
      >
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <!-- Next -->
      <button
        (click)="nextBanner()"
        class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white rounded-full w-10 h-10 flex items-center justify-center shadow"
      >
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <!-- Dots -->
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2">
        <span
          *ngFor="let banner of banners; let i = index"
          (click)="goToBanner(i)"
          class="cursor-pointer rounded-full transition-all duration-300"
          [ngClass]="{
            'w-8 h-2 bg-white': currentBanner === i,
            'w-2 h-2 bg-white/50': currentBanner !== i
          }"
        >
        </span>
      </div>
    </div>
  </div>

  <!-- Categories -->
  <div class="container mx-auto px-2 mt-8 grid grid-cols-4 md:grid-cols-8 lg:grid-cols-10 gap-2">
    <div
      *ngFor="let category of categories"
      (click)="openCategory(category)"
      class="cursor-pointer group text-center"
    >
      <div
        class="bg-cyan-50 rounded-2xl p-2 aspect-square flex items-center justify-center shadow-sm hover:shadow-md transition-all duration-300 group-hover:scale-105"
      >
        <img [src]="category.image" [alt]="category.name" class="w-24 h-22 object-contain" />
      </div>

      <h3 class="mt-3 text-sm md:text-base font-medium text-gray-800 leading-5 line-clamp-2">
        {{ category.name }}
      </h3>
    </div>
  </div>

  <!-- Category Wise Products -->
  <div class="mt-10">
    <app-category-wise-product-display
      *ngFor="let category of categories"
      [id]="category._id"
      [name]="category.name"
    >
    </app-category-wise-product-display>
  </div>
</section>

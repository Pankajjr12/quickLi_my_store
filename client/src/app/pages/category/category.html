<section class="category-page">

  <!-- Header -->
  <div class="page-header">

    <div>
      <h2>Categories</h2>
      <p>{{ categoryData.length }} Categories</p>
    </div>

    <button
      class="add-btn"
      (click)="openUploadCategory()">

      + Add Category

    </button>

  </div>

  <!-- Loading -->
  <app-loading *ngIf="loading"></app-loading>

  <!-- No Data -->
  <app-no-data
    *ngIf="!loading && categoryData.length === 0"
    title="No Categories Found"
    message="Create your first category to organize your products.">
  </app-no-data>

  <!-- Grid -->
  <div
    class="category-grid"
    *ngIf="!loading && categoryData.length">

    <div
      class="category-card"
      *ngFor="let category of categoryData">

      <div class="image-box">

        <img
          [src]="category.image"
          [alt]="category.name">

      </div>

      <div class="content">

        <h4>{{ category.name }}</h4>

        <div class="actions">

          <button
            class="edit-btn"
            (click)="openEdit(category)">

            Edit

          </button>

          <button
            class="delete-btn"
            (click)="deleteCategory(category)">

            Delete

          </button>

        </div>

      </div>

    </div>

  </div>

</section>

<div class="w-[54px] xs:w-[60px] sm:w-[72px] md:w-[96px]">
  <!-- Already Added -->
  <div *ngIf="isAvailableCart" class="flex h-7 sm:h-8 md:h-9 w-full">
    <button
      (click)="decreaseQty()"
      class="flex-1 bg-green-600 hover:bg-green-700 text-white rounded-l-md sm:rounded-l-lg text-xs sm:text-sm"
    >
      −
    </button>

    <div
      class="flex-1 flex items-center justify-center bg-green-50 font-bold text-[10px] sm:text-xs md:text-sm"
    >
      {{ qty }}
    </div>

    <button
      (click)="increaseQty()"
      class="flex-1 bg-green-600 hover:bg-green-700 text-white rounded-r-md sm:rounded-r-lg text-xs sm:text-sm"
    >
      +
    </button>
  </div>

  <!-- Add Button -->
  <button
    *ngIf="!isAvailableCart && data.stock > 0"
    (click)="addToCart()"
    class="w-full h-7 sm:h-8 md:h-9 rounded-md sm:rounded-lg text-[10px] sm:text-xs md:text-sm font-bold bg-green-600 hover:bg-green-700 text-white"
  >
    <span *ngIf="!loading">ADD</span>
    <span *ngIf="loading">...</span>
  </button>

  <!-- Out of Stock -->
  <button
    *ngIf="data.stock <= 0"
    disabled
    class="w-full h-7 sm:h-8 md:h-9 rounded-md sm:rounded-lg bg-gray-200 text-gray-500 text-[10px] sm:text-xs md:text-sm"
  >
    OUT
  </button>
</div>

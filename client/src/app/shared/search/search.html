<div
  class="w-full min-w-[300px] lg:min-w-[420px] h-12  rounded-lg border overflow-hidden flex items-center text-neutral-500 bg-slate-50 group focus-within:border-primary-200">

  <!-- Left Icon -->
  <div>

    <ng-container *ngIf="mobileService.isMobile() && isSearchPage; else searchIcon">

      <a
        (click)="goBack()"
        class="flex justify-center items-center h-full p-2 m-1 bg-white rounded-full shadow-md">

        <i class="fa fa-arrow-left text-xl"></i>

      </a>

    </ng-container>

    <ng-template #searchIcon>

      <button class="flex justify-center items-center h-full p-3">

        <i class="fa fa-search text-xl"></i>

      </button>

    </ng-template>

  </div>

  <!-- Search Area -->
  <div class="w-full h-full">

    <ng-container *ngIf="!isSearchPage; else searchInput">

      <div
        class="w-full h-full flex items-center cursor-pointer"
        (click)="redirectToSearchPage()">

        <span #typedElement></span>

      </div>

    </ng-container>

    <ng-template #searchInput>

      <input
        type="text"
        placeholder="Search for atta dal and more."
        class="bg-transparent w-full h-full outline-none"
        [value]="searchText"
        (input)="handleOnChange($event)"
        autofocus>

    </ng-template>

  </div>

</div>

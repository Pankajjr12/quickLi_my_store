<div class="confirm-container">

    <div class="header">
  
      <h2>Permanent Delete</h2>
  
      <button
        type="button"
        class="close-btn"
        (click)="cancel()">
  
        ✕
  
      </button>
  
    </div>
  
    <p class="message">
  
      {{ data?.message || 'Are you sure you want to permanently delete this item?' }}
  
    </p>
  
    <div class="actions">
  
      <button
        class="cancel-btn"
        (click)="cancel()">
  
        Cancel
  
      </button>
  
      <button
        class="confirm-btn"
        (click)="confirm()">
  
        Confirm
  
      </button>
  
    </div>
  
  </div>

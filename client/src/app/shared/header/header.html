<header
  class="sticky top-0 z-40 bg-white lg:shadow-md flex flex-col justify-center p-2 gap-1 h-24 lg:h-20"
>
  @if (!(isSearchPage && mobileService.isMobile())) {

  <div class="container mx-auto flex items-center justify-between px-2 ">
    <!-- Logo -->

    <a routerLink="/">
      <img src="images/logotxt.png" class="hidden lg:block w-40" />

      <img src="images/logotxt.png" class="lg:hidden w-28" />
    </a>

    <!-- Search -->

    <div class="hidden lg:block mt-2 lg:mt-0">
      <app-search></app-search>
    </div>

    <!-- Right -->

    <div>
      <!-- Mobile -->

      <button class="lg:hidden text-neutral-600" (click)="handleMobileUser()">
        <i class="fa-regular fa-circle-user text-3xl"></i>
      </button>

      <!-- Desktop -->

      <div class="hidden lg:flex items-center gap-10">
        @if(user._id){

        <div class="relative">
          <div
            class="flex items-center gap-1 cursor-pointer select-none"
            (click)="toggleUserMenu()"
          >
            <p>Account</p>

            <i
              class="fa-solid"
              [class.fa-chevron-down]="!openUserMenu"
              [class.fa-chevron-up]="openUserMenu"
            ></i>
          </div>

          @if(openUserMenu){

          <div class="absolute right-0 top-12 bg-white rounded shadow-lg p-4 min-w-52">
            <app-user-menu>< (close)="closeUserMenu()" ></app-user-menu>
          </div>

          }
        </div>

        } @else {

        <button class="text-lg px-2" (click)="goToLogin()">Login</button>

        }

        <!-- Cart -->

        <!-- Cart -->

        <button
          (click)="openCart()"
          class="flex items-center gap-2 bg-green-700 hover:bg-green-600 px-3 py-2 rounded text-white"
        >
          <div class="animate-bounce">
            <i class="fa-solid fa-cart-shopping text-2xl"></i>
          </div>

          <div class="font-semibold text-sm">
            @if(totalQty > 0){

            <div>
              <p>{{ totalQty }} Items</p>

              <p>
                {{ formatPrice(totalPrice) }}
              </p>
            </div>

            } @else {

            <p>My Cart</p>

            }
          </div>
        </button>
      </div>
    </div>
  </div>

  }

  <!-- Mobile Search -->

  <div class="container mx-auto px-2 lg:hidden">
    <app-search></app-search>
  </div>




</header>
